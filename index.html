<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Situations</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .screen {
            display: none; 
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 40px 20px;
            width: 100%; max-width: 800px; box-sizing: border-box;
            min-height: 80vh;
        }

        .active { display: flex; }

        img { max-width: 100%; max-height: 40vh; object-fit: contain; margin-bottom: 30px; }

        .action-btn {
            background-color: var(--primary); color: white;
            border: none; padding: 15px 40px; font-size: 1.2rem; font-weight: bold;
            border-radius: 8px; cursor: pointer; transition: 0.2s;
            margin-bottom: 20px;
        }
        .action-btn:hover { background-color: var(--primary-hover); }

        /* Lobby Accordion Styles */
        #lobby-container { width: 100%; text-align: left; }
        .category-block { background: white; border-radius: 8px; margin-bottom: 12px; border: 1px solid #e2e8f0; }
        .category-block summary { padding: 18px; font-size: 1.2rem; font-weight: bold; cursor: pointer; background: #f1f5f9; list-style: none; }
        .category-content { padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .situation-card { background: #f8fafc; padding: 15px; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; }
        .situation-card:hover { border-color: var(--primary); background: #eff6ff; }

        /* Player Zone Styles */
        .audio-card, .dialogue-card { background: white; border-radius: 12px; padding: 30px; border: 1px solid #e2e8f0; width: 100%; margin-bottom: 20px; text-align: left;}
        audio { width: 100%; margin-top: 15px; }
        
        .line { margin-bottom: 15px; font-size: 1.15rem; line-height: 1.6;}
        .speaker-A { color: #0f172a; font-weight: bold; }
        .speaker-B { color: #334155; font-weight: bold; }

        /* Dictionary Tooltip */
        .vocab { color: var(--primary); border-bottom: 2px dotted var(--primary); cursor: pointer; font-weight: 600; padding: 0 2px; }
        .vocab:hover { background-color: #dbeafe; }
        
        #translation-popup {
            position: absolute; background: #1e293b; color: white; padding: 8px 12px;
            border-radius: 6px; font-size: 1rem; pointer-events: none; opacity: 0;
            transition: 0.2s; transform: translateY(10px); z-index: 1000; font-weight: bold;
        }
        #translation-popup.visible { opacity: 1; transform: translateY(0); }
        .tr-color { color: #fbbf24; margin-left: 5px; }
    </style>
</head>
<body>

    <div id="splash-screen" class="screen active">
        <img src="logo.png" alt="App Logo">
        <button id="btn-start" class="action-btn">Go</button>
    </div>

    <div id="instructions-screen" class="screen">
        <img src="instructions.jpg" alt="Instructions">
        <button id="btn-enter" class="action-btn">Go to Lobby</button>
    </div>

    <div id="lobby-screen" class="screen">
        <h2>Business Situations Lobby</h2>
        <div id="lobby-container"></div>
    </div>

    <div id="player-zone" class="screen">
        <button id="btn-back" class="action-btn" style="align-self: flex-start; padding: 10px 20px; font-size: 1rem;">← Back to Lobby</button>
        
        <div class="audio-card">
            <h3 id="lesson-title" style="margin-top:0;">Lesson Title Here</h3>
            <audio id="audio-player" controls></audio>
        </div>

        <div class="dialogue-card" id="transcript-box">
            </div>
    </div>

    <div id="translation-popup"></div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
