<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Situations</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .page-section {
            display: none; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            width: 100%;
            max-width: 1000px;
            min-height: 80vh;
            box-sizing: border-box;
        }

        .active {
            display: flex;
        }

        .logo {
            max-width: 100%;
            max-height: 30vh;
            object-fit: contain;
            margin-bottom: 40px;
        }

        .instructions {
            max-width: 100%;
            max-height: 60vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }

        .btn-main {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-main:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div id="opening-page" class="page-section active">
        <img src="logo.png" alt="App Logo" class="logo">
        <button class="btn-main" onclick="showInstructions()">Go</button>
    </div>

    <div id="instructions-page" class="page-section">
        <img src="instructions.png" alt="How to use this app" class="instructions">
        <button class="btn-main" onclick="enterLobby()">Go to Lobby</button>
    </div>

    <div id="lobby-page" class="page-section">
        <h2>Business Situations Lobby</h2>
        <p>If you can see this, the buttons are working perfectly!</p>
    </div>

    <script>
        function showInstructions() {
            document.getElementById('opening-page').classList.remove('active');
            document.getElementById('instructions-page').classList.add('active');
        }

        function enterLobby() {
            document.getElementById('instructions-page').classList.remove('active');
            document.getElementById('lobby-page').classList.add('active');
        }
    </script>
</body>
</html>
