<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Situations Lobby</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- Opening Page Styles --- */
        #opening-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            max-width: 800px;
            margin-top: 5vh;
        }

        .logo {
            max-width: 200px;
            height: auto;
            margin-bottom: 20px;
        }

        .instructions {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .btn-enter {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-enter:hover {
            background-color: #004494;
        }
    </style>
</head>
<body>

    <div id="opening-page">
        <img src="logo.png" alt="App Logo" class="logo">
        
        <img src="instructions.jpg" alt="How to use this app" class="instructions">
        
        <button class="btn-enter" onclick="alert('Lobby transition coming next!')">Enter Lobby</button>
    </div>

</body>
</html>
