<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Situations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="splash-screen" class="screen">
        <div class="content-wrapper">
            <div class="image-box"><img src="logo.png" alt="App Logo" id="main-logo"></div>
            <button id="btn-start" class="action-btn-large">START LESSONS</button>
        </div>
    </div>

    <div id="instructions-screen" class="screen hidden">
        <div class="content-wrapper">
            <div class="image-box"><img src="instructions.jpg" alt="Instructions" id="instructions-img"></div>
            <button id="btn-enter" class="action-btn-large">ENTER LOBBY</button>
        </div>
    </div>

    <div id="main-app" class="screen hidden">
        
        <div id="lobby-screen" style="width: 100%; max-width: 700px; margin: 0 auto; padding-bottom: 50px;">
            <h1 id="app-title">The Lobby</h1>
            <div id="lobby-container"></div>
        </div>
        
        <div id="player-zone" class="hidden" style="width: 100%; max-width: 800px; margin: 0 auto;">
            <h2 id="now-playing-title"></h2>
            
            <div class="audio-controls">
                <audio id="audio-player" controls controlsList="nodownload" style="width: 100%;"></audio>
            </div>
            
            <div id="transcript-box" class="dialogue-box">
                </div>
            
            <button id="btn-back-lobby" class="action-btn-large" style="margin-top: 30px;">⬅ BACK TO LOBBY</button>
        </div>
    </div>

    <div id="translation-popup" class="hidden"></div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
