            overflow: hidden;

        .category-block summary {

            font-size: 1.2rem;
            font-weight: bold;
            color: #0f172a;
            cursor: pointer;
            background-color: #f1f5f9;
            transition: background-color 0.2s;
            list-style: none; /* Hides default arrow in some browsers */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-block summary::-webkit-details-marker {
            display: none; /* Hides default arrow in Safari/Chrome */
        }

        .category-block summary:after {
            content: "+"; /* Custom expand icon */
            font-size: 1.5rem;
            color: #2563eb;
        }

        .category-block[open] summary:after {
            content: "−"; /* Custom collapse icon */
        }

        .category-block summary:hover {
            background-color: #e2e8f0;
        }

        .category-content {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            background-color: #ffffff;
        }

        .situation-card {
            background-color: #f8fafc;
            border-radius: 6px;
            padding: 15px;
            text-decoration: none;
            color: inherit;
            border: 1px solid #cbd5e1;
            transition: transform 0.2s, border-color 0.2s;
            display: block;
        }

        function renderLobby() {
            const container = document.getElementById('lobby-container');
            container.innerHTML = ''; 

            lobbyData.forEach(section => {
                // Create the accordion block using <details>
                const details = document.createElement('details');
                details.className = 'category-block';
                
                const summary = document.createElement('summary');
                summary.innerText = section.category;
                details.appendChild(summary);

                // Create the grid for the cards inside this category
                const contentDiv = document.createElement('div');
                contentDiv.className = 'category-content';

                section.situations.forEach(situation => {
                    const card = document.createElement('a');
                    card.className = 'situation-card';
                    card.href = situation.file; 
                    
                    card.innerHTML = `
                        <div class="situation-number">Situation ${situation.id}</div>
                        <div class="situation-title">${situation.title}</div>
                    `;
                    
                    contentDiv.appendChild(card);
                });

                details.appendChild(contentDiv);
                container.appendChild(details);
            });
        }
